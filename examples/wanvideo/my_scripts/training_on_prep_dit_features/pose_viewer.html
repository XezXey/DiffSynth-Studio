<html lang="en">
<head>
<meta charset="utf-8">
<title>Pose Viewer — 3 Samples</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap');

  :root {
    --bg: #07070d;
    --surface: #0f0f1a;
    --border: rgba(255,255,255,0.08);
    --accent: #4ECDC4;
    --accent2: #FF6B6B;
    --text: #e8e8f0;
    --muted: #6b6b88;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header span {
    font-size: 12px; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .grid-header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .col-label {
    padding: 10px 20px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .col-label:first-child {
    border-right: 1px solid var(--border);
    color: var(--accent);
  }
  .col-label:last-child { color: var(--accent2); }

  .sample-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    min-height: 320px;
  }
  .sample-row:last-child { border-bottom: none; }

  .cell {
    position: relative;
    border-right: 1px solid var(--border);
  }
  .cell:last-child { border-right: none; }

  .sample-badge {
    position: absolute; top: 10px; left: 12px; z-index: 20;
    font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700;
    background: rgba(0,0,0,0.6); backdrop-filter:blur(4px);
    border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 10px;
    color: var(--muted);
  }

  iframe {
    width: 100%; height: 320px;
    border: none; display: block;
  }

  /* subtle row hover */
  .sample-row:hover .cell {
    background: rgba(78,205,196,0.015);
  }
</style>
</head>

const T = JOINTS_3D.length;

grid.position.y = -1;
scene.add(grid);

const jointMeshes = [];

  scene.add(mesh);

}

  camera.position.x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = target.y + radius * Math.cos(phi);
  camera.position.z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(target);
}

  const center = [0,1,2].map(k => (minV[k]+maxV[k])/2);
  return joints3d.map(frame =>
    frame.map(j => j.map((v,k) => (v-center[k])/range))
  );
}
const normed = normalizeJoints(JOINTS_3D);

// ── Frame update ───────────────────────────────────────────────────────────────
function setFrame(f) {

    jointMeshes[j].position.set(pts[j][0], pts[j][1], pts[j][2]);
  }
  for (let e=0; e<EDGES.length; e++) {
    const [a,b] = EDGES[e];
    const pos = boneMeshes[e].geom.attributes.position;
    pos.setXYZ(0, pts[a][0], pts[a][1], pts[a][2]);
    pos.setXYZ(1, pts[b][0], pts[b][1], pts[b][2]);
    pos.needsUpdate = true;
  }
}

// ── Playback ───────────────────────────────────────────────────────────────────
let curFrame = 0, playing = false, looping = true;
const slider = document.getElementById('slider');
const frameLabel = document.getElementById('frameLabel');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  frameLabel.textContent = `${curFrame+1} / ${T}`;
  setFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev').addEventListener('click', () => goToFrame(curFrame - 1));
document.getElementById('btnNext').addEventListener('click', () => goToFrame(curFrame + 1));
document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
document.getElementById('btnLoop').addEventListener('click', () => {
  looping = !looping;
  document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
});

let lastTime = 0;
const FPS = 25;
function animate(time) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; time - lastTime > 1000/FPS) {
    lastTime = time;
    const next = curFrame + 1;
    if (next >= T &amp;&amp; !looping) { playing = false; document.getElementById('btnPlay').innerHTML='&amp;#9654;'; }

  renderer.render(scene, camera);
}

const EDGES = [[0, 1], [0, 2], [1, 3], [2, 4], [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16]];
const JOINT_COLORS = [&quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#4ECDC4&quot;, &quot;#4ECDC4&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#96CEB4&quot;, &quot;#96CEB4&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;];

const T = JOINTS_2D.length;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - 40;
}
resize();
window.addEventListener('resize', () => { resize(); drawFrame(curFrame); });

// normalize 2d to canvas
function normalizeJoints2D(joints2d, W, H, pad=0.1) {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const frame of joints2d)
    for (const j of frame) {
      minX=Math.min(minX,j[0]); maxX=Math.max(maxX,j[0]);
      minY=Math.min(minY,j[1]); maxY=Math.max(maxY,j[1]);
    }
  const rangeX = maxX-minX || 1, rangeY = maxY-minY || 1;
  const scale = Math.min((W*(1-2*pad))/rangeX, (H*(1-2*pad))/rangeY);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return joints2d.map(frame =>
    frame.map(j => [
      W/2 + (j[0]-cx)*scale,
      H/2 + (j[1]-cy)*scale
    ])
  );
}

function drawFrame(f) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pts = normed2d[f];

  // draw bones
  for (const [a, b] of EDGES) {
    ctx.beginPath();
    ctx.moveTo(pts[a][0], pts[a][1]);
    ctx.lineTo(pts[b][0], pts[b][1]);
    ctx.strokeStyle = 'rgba(78,205,196,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // draw joints
  for (let j=0; j<pts.length; j++) {
    const [x,y] = pts[j];
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowColor = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const normed2d = normalizeJoints2D(JOINTS_2D, canvas.width, canvas.height);

let curFrame = 0, playing = false;
const slider = document.getElementById('slider2d');
const lbl = document.getElementById('frameLabel2d');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  lbl.textContent = `${curFrame+1} / ${T}`;
  drawFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay2').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay2').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev2').addEventListener('click', () => goToFrame(curFrame-1));
document.getElementById('btnNext2').addEventListener('click', () => goToFrame(curFrame+1));
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

const FPS = 25;
let last = 0;
function animate(t) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; t - last > 1000/FPS) { last = t; goToFrame(curFrame+1); }
}
animate(0);
</script>

const JOINT_COLORS = [&quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#4ECDC4&quot;, &quot;#4ECDC4&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#96CEB4&quot;, &quot;#96CEB4&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;];

const T = JOINTS_3D.length;
const J = JOINTS_3D[0].length;

// ── Scene ──────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(0, 0, 2.5);

// Ambient + directional light
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(1, 2, 3);
scene.add(dir);

// Grid floor
const grid = new THREE.GridHelper(2, 20, 0x222244, 0x1a1a2e);
grid.position.y = -1;
scene.add(grid);

// ── Skeleton objects ───────────────────────────────────────────────────────────
const jointMeshes = [];
const boneMeshes  = [];

for (let j = 0; j < J; j++) {
  const color = new THREE.Color(JOINT_COLORS[j % JOINT_COLORS.length]);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.018, 10, 10),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 })
  );
  scene.add(mesh);
  jointMeshes.push(mesh);
}

  const mat = new THREE.LineBasicMaterial({ color: 0x4ecdc4, linewidth: 2, transparent:true, opacity:0.7 });

let isDragging = false, lastX = 0, lastY = 0;
let theta = 0, phi = Math.PI/4, radius = 2.5;
const target = new THREE.Vector3(0, 0, 0);

function updateCamera() {
  camera.position.x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = target.y + radius * Math.cos(phi);
  camera.position.z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(target);
}

  let minV=[Infinity,Infinity,Infinity], maxV=[-Infinity,-Infinity,-Infinity];
  for (const frame of joints3d)
    for (const j of frame)
      for (let k=0; k<3; k++) { minV[k]=Math.min(minV[k],j[k]); maxV[k]=Math.max(maxV[k],j[k]); }
  const range = Math.max(...[0,1,2].map(k => maxV[k]-minV[k])) || 1;
  const center = [0,1,2].map(k => (minV[k]+maxV[k])/2);
  return joints3d.map(frame =>
    frame.map(j => j.map((v,k) => (v-center[k])/range))
  );
}
const normed = normalizeJoints(JOINTS_3D);

// ── Frame update ───────────────────────────────────────────────────────────────
function setFrame(f) {
  const pts = normed[f];
  for (let j=0; j<J; j++) {
    jointMeshes[j].position.set(pts[j][0], pts[j][1], pts[j][2]);
  }
  for (let e=0; e<EDGES.length; e++) {
    const [a,b] = EDGES[e];
    const pos = boneMeshes[e].geom.attributes.position;
    pos.setXYZ(0, pts[a][0], pts[a][1], pts[a][2]);
    pos.setXYZ(1, pts[b][0], pts[b][1], pts[b][2]);
    pos.needsUpdate = true;
  }
}

// ── Playback ───────────────────────────────────────────────────────────────────
let curFrame = 0, playing = false, looping = true;
const slider = document.getElementById('slider');
const frameLabel = document.getElementById('frameLabel');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  frameLabel.textContent = `${curFrame+1} / ${T}`;
  setFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev').addEventListener('click', () => goToFrame(curFrame - 1));
document.getElementById('btnNext').addEventListener('click', () => goToFrame(curFrame + 1));
document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
document.getElementById('btnLoop').addEventListener('click', () => {
  looping = !looping;
  document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
});
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

let lastTime = 0;
const FPS = 25;
function animate(time) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; time - lastTime > 1000/FPS) {
    lastTime = time;
    const next = curFrame + 1;
    if (next >= T &amp;&amp; !looping) { playing = false; document.getElementById('btnPlay').innerHTML='&amp;#9654;'; }
    else { goToFrame(next); }
  }
  renderer.render(scene, camera);
}

const EDGES = [[0, 1], [0, 2], [1, 3], [2, 4], [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16]];
const JOINT_COLORS = [&quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#4ECDC4&quot;, &quot;#4ECDC4&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#96CEB4&quot;, &quot;#96CEB4&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;];

const T = JOINTS_2D.length;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - 40;
}
resize();
window.addEventListener('resize', () => { resize(); drawFrame(curFrame); });

// normalize 2d to canvas
function normalizeJoints2D(joints2d, W, H, pad=0.1) {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const frame of joints2d)
    for (const j of frame) {
      minX=Math.min(minX,j[0]); maxX=Math.max(maxX,j[0]);
      minY=Math.min(minY,j[1]); maxY=Math.max(maxY,j[1]);
    }
  const rangeX = maxX-minX || 1, rangeY = maxY-minY || 1;
  const scale = Math.min((W*(1-2*pad))/rangeX, (H*(1-2*pad))/rangeY);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return joints2d.map(frame =>
    frame.map(j => [
      W/2 + (j[0]-cx)*scale,
      H/2 + (j[1]-cy)*scale
    ])
  );
}

function drawFrame(f) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pts = normed2d[f];

  // draw bones
  for (const [a, b] of EDGES) {
    ctx.beginPath();
    ctx.moveTo(pts[a][0], pts[a][1]);
    ctx.lineTo(pts[b][0], pts[b][1]);
    ctx.strokeStyle = 'rgba(78,205,196,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // draw joints
  for (let j=0; j<pts.length; j++) {
    const [x,y] = pts[j];
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowColor = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const normed2d = normalizeJoints2D(JOINTS_2D, canvas.width, canvas.height);

let curFrame = 0, playing = false;
const slider = document.getElementById('slider2d');
const lbl = document.getElementById('frameLabel2d');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  lbl.textContent = `${curFrame+1} / ${T}`;
  drawFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay2').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay2').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev2').addEventListener('click', () => goToFrame(curFrame-1));
document.getElementById('btnNext2').addEventListener('click', () => goToFrame(curFrame+1));
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

const FPS = 25;
let last = 0;
function animate(t) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; t - last > 1000/FPS) { last = t; goToFrame(curFrame+1); }
}
animate(0);
</script>

const T = JOINTS_3D.length;
const J = JOINTS_3D[0].length;

// ── Scene ──────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(0, 0, 2.5);

// Ambient + directional light
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(1, 2, 3);
scene.add(dir);

// Grid floor
const grid = new THREE.GridHelper(2, 20, 0x222244, 0x1a1a2e);
grid.position.y = -1;
scene.add(grid);

// ── Skeleton objects ───────────────────────────────────────────────────────────
const jointMeshes = [];
const boneMeshes  = [];

for (let j = 0; j < J; j++) {
  const color = new THREE.Color(JOINT_COLORS[j % JOINT_COLORS.length]);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.018, 10, 10),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 })
  );
  scene.add(mesh);
  jointMeshes.push(mesh);
}

for (let e = 0; e < EDGES.length; e++) {
  const mat = new THREE.LineBasicMaterial({ color: 0x4ecdc4, linewidth: 2, transparent:true, opacity:0.7 });

let isDragging = false, lastX = 0, lastY = 0;
let theta = 0, phi = Math.PI/4, radius = 2.5;
const target = new THREE.Vector3(0, 0, 0);

function updateCamera() {
  camera.position.x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = target.y + radius * Math.cos(phi);
  camera.position.z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(target);
}

  let minV=[Infinity,Infinity,Infinity], maxV=[-Infinity,-Infinity,-Infinity];
  for (const frame of joints3d)
    for (const j of frame)
      for (let k=0; k<3; k++) { minV[k]=Math.min(minV[k],j[k]); maxV[k]=Math.max(maxV[k],j[k]); }
  const range = Math.max(...[0,1,2].map(k => maxV[k]-minV[k])) || 1;
  const center = [0,1,2].map(k => (minV[k]+maxV[k])/2);
  return joints3d.map(frame =>
    frame.map(j => j.map((v,k) => (v-center[k])/range))
  );
}
const normed = normalizeJoints(JOINTS_3D);

// ── Frame update ───────────────────────────────────────────────────────────────
function setFrame(f) {
  const pts = normed[f];
  for (let j=0; j<J; j++) {
    jointMeshes[j].position.set(pts[j][0], pts[j][1], pts[j][2]);
  }
  for (let e=0; e<EDGES.length; e++) {
    const [a,b] = EDGES[e];
    const pos = boneMeshes[e].geom.attributes.position;
    pos.setXYZ(0, pts[a][0], pts[a][1], pts[a][2]);
    pos.setXYZ(1, pts[b][0], pts[b][1], pts[b][2]);
    pos.needsUpdate = true;
  }
}

// ── Playback ───────────────────────────────────────────────────────────────────
let curFrame = 0, playing = false, looping = true;
const slider = document.getElementById('slider');
const frameLabel = document.getElementById('frameLabel');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  frameLabel.textContent = `${curFrame+1} / ${T}`;
  setFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev').addEventListener('click', () => goToFrame(curFrame - 1));
document.getElementById('btnNext').addEventListener('click', () => goToFrame(curFrame + 1));
document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
document.getElementById('btnLoop').addEventListener('click', () => {
  looping = !looping;
  document.getElementById('btnLoop').style.color = looping ? '#4ECDC4' : '#aaa';
});
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

let lastTime = 0;
const FPS = 25;
function animate(time) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; time - lastTime > 1000/FPS) {
    lastTime = time;
    const next = curFrame + 1;
    if (next >= T &amp;&amp; !looping) { playing = false; document.getElementById('btnPlay').innerHTML='&amp;#9654;'; }
    else { goToFrame(next); }
  }
  renderer.render(scene, camera);
}

const EDGES = [[0, 1], [0, 2], [1, 3], [2, 4], [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16]];
const JOINT_COLORS = [&quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#FF6B6B&quot;, &quot;#4ECDC4&quot;, &quot;#4ECDC4&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#45B7D1&quot;, &quot;#96CEB4&quot;, &quot;#96CEB4&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;, &quot;#FFEAA7&quot;];

const T = JOINTS_2D.length;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - 40;
}
resize();
window.addEventListener('resize', () => { resize(); drawFrame(curFrame); });

// normalize 2d to canvas
function normalizeJoints2D(joints2d, W, H, pad=0.1) {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const frame of joints2d)
    for (const j of frame) {
      minX=Math.min(minX,j[0]); maxX=Math.max(maxX,j[0]);
      minY=Math.min(minY,j[1]); maxY=Math.max(maxY,j[1]);
    }
  const rangeX = maxX-minX || 1, rangeY = maxY-minY || 1;
  const scale = Math.min((W*(1-2*pad))/rangeX, (H*(1-2*pad))/rangeY);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return joints2d.map(frame =>
    frame.map(j => [
      W/2 + (j[0]-cx)*scale,
      H/2 + (j[1]-cy)*scale
    ])
  );
}

function drawFrame(f) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pts = normed2d[f];

  // draw bones
  for (const [a, b] of EDGES) {
    ctx.beginPath();
    ctx.moveTo(pts[a][0], pts[a][1]);
    ctx.lineTo(pts[b][0], pts[b][1]);
    ctx.strokeStyle = 'rgba(78,205,196,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // draw joints
  for (let j=0; j<pts.length; j++) {
    const [x,y] = pts[j];
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowColor = JOINT_COLORS[j % JOINT_COLORS.length];
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const normed2d = normalizeJoints2D(JOINTS_2D, canvas.width, canvas.height);

let curFrame = 0, playing = false;
const slider = document.getElementById('slider2d');
const lbl = document.getElementById('frameLabel2d');
slider.max = T - 1;

function goToFrame(f) {
  curFrame = (f + T) % T;
  slider.value = curFrame;
  lbl.textContent = `${curFrame+1} / ${T}`;
  drawFrame(curFrame);
}
goToFrame(0);

document.getElementById('btnPlay2').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay2').innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev2').addEventListener('click', () => goToFrame(curFrame-1));
document.getElementById('btnNext2').addEventListener('click', () => goToFrame(curFrame+1));
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

const FPS = 25;
let last = 0;
function animate(t) {
  requestAnimationFrame(animate);
  if (playing &amp;&amp; t - last > 1000/FPS) { last = t; goToFrame(curFrame+1); }
}
animate(0);
</script>
