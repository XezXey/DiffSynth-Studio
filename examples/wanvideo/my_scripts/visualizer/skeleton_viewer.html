const EDGES     = [[0, 1], [1, 4], [4, 7], [7, 10], [0, 2], [2, 5], [5, 8], [8, 11], [0, 3], [3, 6], [6, 9], [9, 12], [12, 15], [12, 13], [13, 16], [16, 18], [18, 20], [12, 14], [14, 17], [17, 19], [19, 21]];
const T         = 80;
const J         = SKELETONS[0].joints[0].length;

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.VSMShadowMap;
renderer.setClearColor(0x1a1a2e);
document.body.appendChild(renderer.domElement);

// ── Scene &amp; camera ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 1.6, 3.5);

// ── OrbitControls ─────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 0.5;
controls.maxDistance      = 20;
controls.update();

// ── Lights ────────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(2, 4, 3);
dirLight.castShadow              = true;
dirLight.shadow.radius           = 1.5;
dirLight.shadow.blurSamples      = 12;
dirLight.shadow.bias             = -0.002;
dirLight.shadow.mapSize.width    = 1024;
dirLight.shadow.mapSize.height   = 1024;
const sc = dirLight.shadow.camera;
sc.left = sc.bottom = -6;
sc.right = sc.top   =  6;
sc.near = 0.5; sc.far = 30;
scene.add(dirLight);

const ptLight = new THREE.PointLight(0xffffff, 0.3);
ptLight.position.set(4, 8, 4);
scene.add(ptLight);

// ── Checkerboard floor ────────────────────────────────────────────────────────
(function buildFloor() {
  const PATCH = 0.5, SIZE = 10, REPS = Math.ceil(SIZE / PATCH);

  // Canvas texture
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.canvas.width = ctx.canvas.height = 2;
  ctx.fillStyle = '#3d3d5c'; ctx.fillRect(0, 0, 2, 2);
  ctx.fillStyle = '#2a2a40'; ctx.fillRect(0, 1, 1, 1);  // one dark square
  const tex = new THREE.CanvasTexture(ctx.canvas);
  tex.magFilter = THREE.NearestFilter;

  const geom = new THREE.PlaneGeometry(REPS * PATCH, REPS * PATCH, REPS, REPS).toNonIndexed();
  geom.rotateX(-Math.PI / 2);
  // remap UVs so each quad gets one texel
  const uv = geom.attributes.uv;
  let counter = 0, flip = 0;
  for (let i = 0; i < uv.count; i++) {
    if (i > 0 &amp;&amp; i % 6 === 0) {
      counter++;
      if (counter % REPS === 0) flip = 1 - flip;
    }
    uv.setXY(i, (counter + flip) % 2, (counter + flip) % 2);
  }

  const mat = new THREE.MeshPhongMaterial({
    color: 0xffffff, map: tex, opacity: 0.85, transparent: true,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // Mirror reflector
  const mirrorGeom = new THREE.PlaneGeometry(REPS * PATCH, REPS * PATCH);
  const mirror = new THREE.Reflector(mirrorGeom, {
    clipBias : 0.003,
    textureWidth : window.innerWidth  * window.devicePixelRatio,
    textureHeight: window.innerHeight * window.devicePixelRatio,
    color: 0x222244,
  });
  mirror.rotateX(-Math.PI / 2);
  mirror.position.y = -0.001;
  scene.add(mirror);
})();

// ── Axes helper ───────────────────────────────────────────────────────────────
scene.add(new THREE.AxesHelper(0.4));

// ── Normalize: fit all skeleton data into a unit-ish volume ──────────────────
function normalizeSkeletons(skels) {
  let mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
  for (const s of skels)
    for (const frame of s.joints)
      for (const jt of frame)
        for (let k = 0; k < 3; k++) {
          if (jt[k] < mn[k]) mn[k] = jt[k];
          if (jt[k] > mx[k]) mx[k] = jt[k];
        }
  const range = Math.max(...[0,1,2].map(k => mx[k] - mn[k])) || 1;
  const center = [0,1,2].map(k => (mn[k] + mx[k]) / 2);
  // shift center to (0, target_y, 0) so feet rest on floor
  const targetY = (mx[1] - mn[1]) / (2 * range);
  return skels.map(s => ({
    ...s,
    joints: s.joints.map(frame =>
      frame.map(jt => [
        (jt[0] - center[0]) / range,
        (jt[1] - center[1]) / range + targetY,
        (jt[2] - center[2]) / range,
      ])
    ),
  }));
}
const normedSkels = normalizeSkeletons(SKELETONS.map(s => ({ ...s, joints: s.joints })));

// ── Build Three.js skeleton objects ──────────────────────────────────────────
const skelObjects = normedSkels.map(skel => {
  const color3 = new THREE.Color(skel.color);
  const jMat   = new THREE.MeshStandardMaterial({
    color: color3, emissive: color3, emissiveIntensity: 0.5,
  });
  const jGeo = new THREE.SphereGeometry(0.022, 10, 10);

  const joints = Array.from({ length: J }, () => {
    const m = new THREE.Mesh(jGeo, jMat);
    m.castShadow = true;
    scene.add(m);
    return m;
  });

  const bMat  = new THREE.LineBasicMaterial({
    color: color3, transparent: true, opacity: 0.8,
  });
  const bones = EDGES.map(() => {
    const geo  = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, bMat);
    line.castShadow = false;
    scene.add(line);
    return line;
  });

  return { joints, bones, normedJoints: skel.joints };
});

// ── Frame rendering ───────────────────────────────────────────────────────────
function setFrame(f) {
  for (const obj of skelObjects) {
    const pts = obj.normedJoints[f];
    for (let j = 0; j < J; j++) {
      obj.joints[j].position.set(pts[j][0], pts[j][1], pts[j][2]);
    }
    for (let e = 0; e < EDGES.length; e++) {
      const [a, b] = EDGES[e];
      const pos    = obj.bones[e].geometry.attributes.position;
      pos.setXYZ(0, pts[a][0], pts[a][1], pts[a][2]);
      pos.setXYZ(1, pts[b][0], pts[b][1], pts[b][2]);
      pos.needsUpdate = true;
    }
  }
}

// ── Playback state ────────────────────────────────────────────────────────────
let curFrame = 0, playing = false, looping = true;

const slider     = document.getElementById('slider');
const frameLabel = document.getElementById('frameLabel');
const frameLabel2= document.getElementById('frameLabel2');

function goToFrame(f) {
  curFrame     = ((f % T) + T) % T;
  slider.value = curFrame;
  const txt    = `${curFrame + 1} / ${T}`;
  frameLabel.textContent  = txt;
  frameLabel2.textContent = `frame ${curFrame + 1} / ${T}`;
  setFrame(curFrame);
}
goToFrame(0);

const btnPlay = document.getElementById('btnPlay');
const btnLoop = document.getElementById('btnLoop');

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev').addEventListener('click', () => goToFrame(curFrame - 1));
document.getElementById('btnNext').addEventListener('click', () => goToFrame(curFrame + 1));
btnLoop.addEventListener('click', () => {
  looping = !looping;
  btnLoop.classList.toggle('active', looping);
});
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

// Fixed-timestep accumulator (matches main.js pattern)
const FPS     = 25;
const STEP    = 1 / FPS;
let   accumulator = 0;
let   prevTime    = performance.now() / 1000;
let   wasPlaying  = false;

function animLoop(now) {
  requestAnimationFrame(animLoop);

  const t  = now / 1000;
  let   dt = Math.min(t - prevTime, 0.1);
  prevTime = t;

  if (playing) {
    if (!wasPlaying) { accumulator = 0; wasPlaying = true; }
    accumulator += dt;
    while (accumulator >= STEP) {
      const next = curFrame + 1;
      if (next >= T &amp;&amp; !looping) {
        playing = false;
        btnPlay.innerHTML = '&amp;#9654;';
      } else {
        goToFrame(next);
      }
      accumulator -= STEP;
    }
  } else {
    wasPlaying = false;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animLoop);
</script>

const EDGES     = [[0, 1], [1, 4], [4, 7], [7, 10], [0, 2], [2, 5], [5, 8], [8, 11], [0, 3], [3, 6], [6, 9], [9, 12], [12, 15], [12, 13], [13, 16], [16, 18], [18, 20], [12, 14], [14, 17], [17, 19], [19, 21]];
const T         = 80;
const J         = SKELETONS[0].joints[0].length;

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.VSMShadowMap;
renderer.setClearColor(0x1a1a2e);
document.body.appendChild(renderer.domElement);

// ── Scene &amp; camera ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 1.6, 3.5);

// ── OrbitControls ─────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 0.5;
controls.maxDistance      = 20;
controls.update();

// ── Lights ────────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(2, 4, 3);
dirLight.castShadow              = true;
dirLight.shadow.radius           = 1.5;
dirLight.shadow.blurSamples      = 12;
dirLight.shadow.bias             = -0.002;
dirLight.shadow.mapSize.width    = 1024;
dirLight.shadow.mapSize.height   = 1024;
const sc = dirLight.shadow.camera;
sc.left = sc.bottom = -6;
sc.right = sc.top   =  6;
sc.near = 0.5; sc.far = 30;
scene.add(dirLight);

const ptLight = new THREE.PointLight(0xffffff, 0.3);
ptLight.position.set(4, 8, 4);
scene.add(ptLight);

// ── Checkerboard floor ────────────────────────────────────────────────────────
(function buildFloor() {
  const PATCH = 0.5, SIZE = 10, REPS = Math.ceil(SIZE / PATCH);

  // Canvas texture
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.canvas.width = ctx.canvas.height = 2;
  ctx.fillStyle = '#3d3d5c'; ctx.fillRect(0, 0, 2, 2);
  ctx.fillStyle = '#2a2a40'; ctx.fillRect(0, 1, 1, 1);  // one dark square
  const tex = new THREE.CanvasTexture(ctx.canvas);
  tex.magFilter = THREE.NearestFilter;

  const geom = new THREE.PlaneGeometry(REPS * PATCH, REPS * PATCH, REPS, REPS).toNonIndexed();
  geom.rotateX(-Math.PI / 2);
  // remap UVs so each quad gets one texel
  const uv = geom.attributes.uv;
  let counter = 0, flip = 0;
  for (let i = 0; i < uv.count; i++) {
    if (i > 0 &amp;&amp; i % 6 === 0) {
      counter++;
      if (counter % REPS === 0) flip = 1 - flip;
    }
    uv.setXY(i, (counter + flip) % 2, (counter + flip) % 2);
  }

  const mat = new THREE.MeshPhongMaterial({
    color: 0xffffff, map: tex, opacity: 0.85, transparent: true,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // Mirror reflector
  const mirrorGeom = new THREE.PlaneGeometry(REPS * PATCH, REPS * PATCH);
  const mirror = new THREE.Reflector(mirrorGeom, {
    clipBias : 0.003,
    textureWidth : window.innerWidth  * window.devicePixelRatio,
    textureHeight: window.innerHeight * window.devicePixelRatio,
    color: 0x222244,
  });
  mirror.rotateX(-Math.PI / 2);
  mirror.position.y = -0.001;
  scene.add(mirror);
})();

// ── Axes helper ───────────────────────────────────────────────────────────────
scene.add(new THREE.AxesHelper(0.4));

// ── Normalize: fit all skeleton data into a unit-ish volume ──────────────────
function normalizeSkeletons(skels) {
  let mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
  for (const s of skels)
    for (const frame of s.joints)
      for (const jt of frame)
        for (let k = 0; k < 3; k++) {
          if (jt[k] < mn[k]) mn[k] = jt[k];
          if (jt[k] > mx[k]) mx[k] = jt[k];
        }
  const range = Math.max(...[0,1,2].map(k => mx[k] - mn[k])) || 1;
  const center = [0,1,2].map(k => (mn[k] + mx[k]) / 2);
  // shift center to (0, target_y, 0) so feet rest on floor
  const targetY = (mx[1] - mn[1]) / (2 * range);
  return skels.map(s => ({
    ...s,
    joints: s.joints.map(frame =>
      frame.map(jt => [
        (jt[0] - center[0]) / range,
        (jt[1] - center[1]) / range + targetY,
        (jt[2] - center[2]) / range,
      ])
    ),
  }));
}
const normedSkels = normalizeSkeletons(SKELETONS.map(s => ({ ...s, joints: s.joints })));

// ── Build Three.js skeleton objects ──────────────────────────────────────────
const skelObjects = normedSkels.map(skel => {
  const color3 = new THREE.Color(skel.color);
  const jMat   = new THREE.MeshStandardMaterial({
    color: color3, emissive: color3, emissiveIntensity: 0.5,
  });
  const jGeo = new THREE.SphereGeometry(0.022, 10, 10);

  const joints = Array.from({ length: J }, () => {
    const m = new THREE.Mesh(jGeo, jMat);
    m.castShadow = true;
    scene.add(m);
    return m;
  });

  const bMat  = new THREE.LineBasicMaterial({
    color: color3, transparent: true, opacity: 0.8,
  });
  const bones = EDGES.map(() => {
    const geo  = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, bMat);
    line.castShadow = false;
    scene.add(line);
    return line;
  });

  return { joints, bones, normedJoints: skel.joints };
});

// ── Frame rendering ───────────────────────────────────────────────────────────
function setFrame(f) {
  for (const obj of skelObjects) {
    const pts = obj.normedJoints[f];
    for (let j = 0; j < J; j++) {
      obj.joints[j].position.set(pts[j][0], pts[j][1], pts[j][2]);
    }
    for (let e = 0; e < EDGES.length; e++) {
      const [a, b] = EDGES[e];
      const pos    = obj.bones[e].geometry.attributes.position;
      pos.setXYZ(0, pts[a][0], pts[a][1], pts[a][2]);
      pos.setXYZ(1, pts[b][0], pts[b][1], pts[b][2]);
      pos.needsUpdate = true;
    }
  }
}

// ── Playback state ────────────────────────────────────────────────────────────
let curFrame = 0, playing = false, looping = true;

const slider     = document.getElementById('slider');
const frameLabel = document.getElementById('frameLabel');
const frameLabel2= document.getElementById('frameLabel2');

function goToFrame(f) {
  curFrame     = ((f % T) + T) % T;
  slider.value = curFrame;
  const txt    = `${curFrame + 1} / ${T}`;
  frameLabel.textContent  = txt;
  frameLabel2.textContent = `frame ${curFrame + 1} / ${T}`;
  setFrame(curFrame);
}
goToFrame(0);

const btnPlay = document.getElementById('btnPlay');
const btnLoop = document.getElementById('btnLoop');

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.innerHTML = playing ? '&amp;#9646;&amp;#9646;' : '&amp;#9654;';
});
document.getElementById('btnPrev').addEventListener('click', () => goToFrame(curFrame - 1));
document.getElementById('btnNext').addEventListener('click', () => goToFrame(curFrame + 1));
btnLoop.addEventListener('click', () => {
  looping = !looping;
  btnLoop.classList.toggle('active', looping);
});
slider.addEventListener('input', () => goToFrame(parseInt(slider.value)));

// Fixed-timestep accumulator (matches main.js pattern)
const FPS     = 25;
const STEP    = 1 / FPS;
let   accumulator = 0;
let   prevTime    = performance.now() / 1000;
let   wasPlaying  = false;

function animLoop(now) {
  requestAnimationFrame(animLoop);

  const t  = now / 1000;
  let   dt = Math.min(t - prevTime, 0.1);
  prevTime = t;

  if (playing) {
    if (!wasPlaying) { accumulator = 0; wasPlaying = true; }
    accumulator += dt;
    while (accumulator >= STEP) {
      const next = curFrame + 1;
      if (next >= T &amp;&amp; !looping) {
        playing = false;
        btnPlay.innerHTML = '&amp;#9654;';
      } else {
        goToFrame(next);
      }
      accumulator -= STEP;
    }
  } else {
    wasPlaying = false;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animLoop);
</script>
