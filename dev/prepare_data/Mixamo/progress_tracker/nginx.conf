# render_monitor — Nginx config
# Drop this in /etc/nginx/sites-available/render_monitor
# then: sudo ln -s /etc/nginx/sites-available/render_monitor /etc/nginx/sites-enabled/
# and:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # or your hostname / IP

    # ── Flask app (HTML pages + API) ──────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;   # don't buffer API/HTML responses
    }

    # ── Direct static file serving for rendered frames ────────────────────────
    # Flask never sees these requests — Nginx serves them with sendfile().
    #
    # URL pattern:  /renders/<char>/<motion>/<cam_dir>/<filename>
    # Maps to:      /data/mint/Motion_Dataset/Mixamo/render_fbx/<char>/...
    #
    # Change `alias` to match your RENDER_ROOT.
    location /renders/ {
        alias /data/mint/Motion_Dataset/Mixamo/render_fbx/;

        # Only allow PNG frame files — block directory listing and other files
        location ~* /renders/.*\.png$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
            # sendfile is on by default in Nginx — kernel-level zero-copy
        }

        # Block everything else under /renders/
        location /renders/ {
            return 403;
        }
    }

    # Increase timeouts for slow disks with many frames
    send_timeout         60s;
    keepalive_timeout    65s;
}
